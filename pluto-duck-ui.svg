      <text x="64" y="724" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">YK</text>
      <text x="86" y="716" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600">Yoojung Kim</text>
      <text x="86" y="730" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">your@gmail.com</text>

      <!-- ==================== CENTER PANEL (BOARD) ==================== -->
      <line x1="820" y1="40" x2="820" y2="760" stroke="#E5E5EA" stroke-width="1" />

