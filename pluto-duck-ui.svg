        <circle cx="6" cy="116" r="2" fill="#86868B" />
        <text x="18" y="120" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">meta_facebook_ads_20251222_20251231</text>
        
        <circle cx="6" cy="140" r="2" fill="#86868B" />
        <text x="18" y="144" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">meta_facebook_ads_20251201_20251214</text>
        
        <circle cx="6" cy="164" r="2" fill="#86868B" />
        <text x="18" y="168" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">meta_instagram_ads_20251222_20251231</text>
        
        <circle cx="6" cy="188" r="2" fill="#86868B" />
        <text x="18" y="192" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">linkedin_ads_20251222_20251231</text>

