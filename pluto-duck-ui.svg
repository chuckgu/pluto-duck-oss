        <path d="M72 638l3 3 3-3" stroke="#86868B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        
        <text x="96" y="644" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">GPT-5 Mini</text>
        <path d="M166 638l3 3 3-3" stroke="#86868B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" />

