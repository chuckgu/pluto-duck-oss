        <text x="44" y="105" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">12.0K</text>
        <text x="44" y="145" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">8.0K</text>
        <text x="44" y="185" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">4.0K</text>
        <text x="44" y="225" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="end">0</text>
        
