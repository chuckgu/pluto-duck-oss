<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <filter id="mac-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="40" y="40" width="1120" height="720" rx="10" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#000000" />

  <!-- Main Window -->
  <g filter="url(#mac-shadow)">
    <!-- Base -->
