      <text x="314" y="550" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" line-height="1.6">
        <tspan x="314" dy="0">전체 추이: 12/25에 큰 급등(+39.9%)이 있고 다음 날(12/26)엔 급락(-27.1%) — 크리스마스(또는 캠페인</tspan>
        <tspan x="314" dy="22">예산 변경) 관련 일시적 변동으로 보입니다. 그 외 날짜는 대체로 30k~37k 범위에서 변동합니다.</tspan>
      </text>

      <circle cx="300" cy="600" r="2.5" fill="#86868B" />
      <text x="314" y="604" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" line-height="1.6">
        <tspan x="314" dy="0">플랫폼 기여도: Instagram이 일간 최대 기여(약 12k~15k)로 가장 큰 비중을 차지하고, Facebook도 꾸준히</tspan>
        <tspan x="314" dy="22">높은 노출(약 10k~14k)입니다. Google은 일별 3~4k 수준, LinkedIn은 일별 4~5k 수준으로 비교적 작지만</tspan>
        <tspan x="314" dy="22">(노출은 적음) 비용(Spend)/CPM이 매우 높아 보입니다.</tspan>
      </text>

      <circle cx="300" cy="676" r="2.5" fill="#86868B" />
      <text x="314" y="680" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" line-height="1.6">
        <tspan x="314" dy="0">상위 캠페인(기간 합계, 상위 6개): Instagram Acquisition(119,331), Facebook Acquisition(107,548),</tspan>
        <tspan x="314" dy="22">LinkedIn Acquisition(48,009), Google Acquisition(37,212), Facebook Retargeting(18,754),</tspan>
      </text>


