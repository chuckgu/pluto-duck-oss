        </g>
        <g stroke="#86868B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(36, 280) scale(0.8)">
          <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
        </g>
        <g stroke="#86868B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(66, 280) scale(0.8)">
          <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>
        </g>

        <!-- Thought Process 2 -->
        <circle cx="4" cy="326" r="4" fill="#34C759" />
        <text x="16" y="330" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Thought for a few seconds</text>
        <path d="M164 324l4 4 4-4" stroke="#86868B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

        <!-- User Message 2 -->
        <rect x="70" y="340" width="230" height="66" rx="12" fill="#F2F2F7" />
        <text x="86" y="362" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">meta_facebook_ads_20251222_</text>
        <text x="86" y="378" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">20251231</text>
        <text x="86" y="394" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">이거에 대한 전처리만 진행</text>

        <!-- Agent Response 2 -->
        <text x="0" y="440" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">다음 이슈(진단 결과)를 찾았습니다 — 각 항목에 대해 제안된</text>
        <text x="0" y="460" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">수정안을 적용할까요? (예: "모두 적용", 또는 번호로 예/아니</text>
        <text x="0" y="480" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">오 선택)</text>

        <text x="0" y="510" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">1. 지출 있음에도 전환이 0인 값 존재</text>
        <circle cx="20" cy="530" r="2" fill="#86868B" />
        <text x="32" y="534" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">제안: 행을 삭제하지 않고...</text>

        <!-- Chart Type Buttons -->
        <g transform="translate(0, 546)">
