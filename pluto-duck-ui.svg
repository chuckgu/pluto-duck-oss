          <rect x="50" y="0" width="36" height="24" rx="4" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
          <text x="68" y="16" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Bar</text>
          
          <rect x="90" y="0" width="40" height="24" rx="4" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
