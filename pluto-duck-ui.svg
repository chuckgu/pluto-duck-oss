      <text x="540" y="125" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">February 25, 2026 at 8:35 PM</text>
      <text x="290" y="165" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">광고 성과 데이터 탐색</text>

      <!-- Chart Block -->
      <rect x="290" y="200" width="500" height="280" rx="8" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
      <g transform="translate(290, 200)">
        <rect x="16" y="16" width="12" height="12" fill="#34C759" />
        <rect x="18" y="18" width="8" height="8" fill="#007AFF" />
        <text x="36" y="26" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ads_meta_timeseries_campaign_performance_202512_metrics_nonzero_view</text>
        
        <text x="430" y="26" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Refresh</text>
        <path d="M470 23h2M474 23h2M478 23h2" stroke="#86868B" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="40" x2="500" y2="40" stroke="#F2F2F7" stroke-width="1" />

