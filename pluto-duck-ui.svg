        <text x="18" y="216" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">google_ads_20251222_20251231</text>

        <text x="0" y="246" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">전처리는 분석 품질을 높입니다. 지금 전처리를 실행할까요?</text>
        <text x="0" y="266" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">(예/아니오)</text>

        <!-- Feedback icons -->
        <g stroke="#86868B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(6, 280) scale(0.8)">
