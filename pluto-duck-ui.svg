      <text x="430" y="79" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">2025-12월</text>
      <text x="510" y="79" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="16">+</text>
      
